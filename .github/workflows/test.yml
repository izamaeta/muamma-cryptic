name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and migrations
    runs-on: ubuntu-latest

    # Throwaway database for this run only. These values are test fixtures,
    # not secrets: the container is created and destroyed with the job and is
    # never reachable from outside the runner.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: muamma
          POSTGRES_PASSWORD: muamma-ci
          POSTGRES_DB: muamma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muamma -d muamma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: muamma
      SECRET_KEY: ci-only-not-a-real-key
      DATABASE_URL: postgresql+psycopg://muamma:muamma-ci@127.0.0.1:5432/muamma_ci
      RATELIMIT_STORAGE_URI: memory://
      SITE_URL: http://localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest

      # The suite runs on SQLite; this is where the migrations meet the real
      # database they will run against.
      - name: Run migrations on PostgreSQL
        run: flask db upgrade

      - name: Compare models against migrations
        run: flask db check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest

    # Same throwaway arrangement as the suite above; the browser tests get
    # their own database so they never share rows with anything else.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: muamma
          POSTGRES_PASSWORD: muamma-ci
          POSTGRES_DB: muamma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muamma -d muamma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_APP: muamma
      SECRET_KEY: ci-only-not-a-real-key
      DATABASE_URL: postgresql+psycopg://muamma:muamma-ci@127.0.0.1:5432/muamma_e2e
      E2E_DATABASE_URL: postgresql+psycopg://muamma:muamma-ci@127.0.0.1:5432/muamma_e2e
      RATELIMIT_STORAGE_URI: memory://
      SITE_URL: http://localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create the e2e database
        env:
          PGPASSWORD: muamma-ci
        run: psql -h 127.0.0.1 -U muamma -d muamma_ci -c 'CREATE DATABASE muamma_e2e'

      - name: Run migrations on PostgreSQL
        run: flask db upgrade

      # Keyed on the requirements, which is where the browser version is pinned.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: pytest -m e2e
        run: >-
          pytest -m e2e
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output e2e-artifacts

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds and throws away: this only answers whether the image still
      # builds, so there is no registry and no credentials.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
