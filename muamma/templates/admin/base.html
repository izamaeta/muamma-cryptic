<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Yönetim – Muamma{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('admin.dashboard') }}">Muamma yönetim</a>
       <nav>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('admin.puzzles') }}">Bulmacalar</a>
        <a href="{{ url_for('admin.puzzle_new', kind='daily') }}">Yeni günlük</a>
        <a href="{{ url_for('admin.puzzle_new', kind='practice') }}">Yeni tadımlık</a>
      {% endif %}
    </nav>
    {% if current_user.is_authenticated %}
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Çıkış</button>
      </form>
    {% endif %}
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
