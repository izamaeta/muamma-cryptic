<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Muamma – Günlük Türkçe Cryptic Bulmaca{% endblock %}</title>
  <meta name="description" content="{% block description %}Her gün yeni bir Türkçe cryptic bulmaca.{% endblock %}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">Muamma</a>
    <nav>
      <a href="{{ url_for('main.practice_random') }}">Tadımlık</a>
      <a href="{{ url_for('main.stats') }}">İstatistik</a>
    </nav>
    <p class="streak">Seri: <span class="streak-count">{{ streak }}</span></p>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
