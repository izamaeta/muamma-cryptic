<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Muamma – Günlük Türkçe Cryptic Bulmaca{% endblock %}</title>
  <meta name="description" content="{% block description %}Her gün yeni bir Türkçe cryptic bulmaca. Tek ipucu, tek cevap: tanımı bul, kelime oyununu çöz.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <link rel="canonical" href="{{ canonical_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Muamma">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='img/og.png') }}">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#f7f3ea">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">Muamma</a>
    <nav>
      <a href="{{ url_for('main.practice_random') }}">Tadımlık</a>
      <a href="{{ url_for('main.stats') }}">İstatistik</a>
      <a href="{{ url_for('main.how_to_play') }}">Nasıl oynanır</a>
    </nav>
    <p class="streak">Seri: <span class="streak-count">{{ streak }}</span></p>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <nav>
      <a href="{{ url_for('main.how_to_play') }}">Nasıl oynanır</a>
      <a href="{{ url_for('main.privacy') }}">Gizlilik</a>
    </nav>
    <p>Muamma · Günlük Türkçe cryptic bulmaca</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
